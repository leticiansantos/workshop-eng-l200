# Databricks Asset Bundle (opcional) — Workshop Hapvida x Databricks
# Alternativa ao deploy.sh para publicar os artefatos do workshop.
#
# Uso:
#   databricks bundle deploy -t dev
#
bundle:
  name: hapvida-saude-workshop

targets:
  dev:
    default: true
    workspace:
      host: https://adb-7405610863872788.8.azuredatabricks.net
      root_path: /Workspace/Shared/hapvida-saude-workshop/.bundle/${bundle.name}

